<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vynex - Product Management</title>
    <link rel="stylesheet" href="product.css">
</head>
<body>

<div class="product-container">

    <h1>Product Management</h1>

    <form id="productForm">

        <!-- BASIC INFO -->
        <div class="section">
            <h2>Basic Information</h2>
            <input type="text"     id="name"        placeholder="Product Name" required>
            <textarea             id="description"  placeholder="Product Description"></textarea>
            <input type="text"     id="category"     placeholder="Category">
        </div>

        <!-- PRICING -->
        <div class="section">
            <h2>Pricing Details</h2>
            <input type="number"   id="sellingPrice"       placeholder="Selling Price (₹)" step="0.01">
            <input type="number"   id="manufacturingCost"  placeholder="Manufacturing Cost (₹)" step="0.01">
            <input type="number"   id="discountPercent"    placeholder="Discount (%)" step="0.1">
        </div>

        <!-- STOCK INFO -->
        <div class="section">
            <h2>Stock Information</h2>
            <input type="number"   id="stockQuantity"  placeholder="Stock Quantity">
            <input type="text"     id="supplierName"   placeholder="Supplier Name">
        </div>

        <button type="submit" class="auth-btn">Save Product</button>
        <p id="msg" style="margin-top:10px; color:green;"></p>

    </form>

</div>

<script>
// Session guard
const token = localStorage.getItem("vynex_token");
if (!token) window.location.href = "signin.html";

document.getElementById("productForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const msg = document.getElementById("msg");

    const product = {
        name:               document.getElementById("name").value,
        description:        document.getElementById("description").value,
        category:           document.getElementById("category").value,
        sellingPrice:       parseFloat(document.getElementById("sellingPrice").value) || 0,
        manufacturingCost:  parseFloat(document.getElementById("manufacturingCost").value) || 0,
        discountPercent:    parseFloat(document.getElementById("discountPercent").value) || 0,
        stockQuantity:      parseInt(document.getElementById("stockQuantity").value) || 0,
        supplierName:       document.getElementById("supplierName").value
    };

    const res = await fetch("/api/products", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },
        body: JSON.stringify(product)
    });

    const data = await res.json();

    if (res.ok) {
        msg.style.color = "green";
        msg.textContent = "✓ " + data.message;
        this.reset(); // clear form so another product can be added
    } else {
        msg.style.color = "red";
        msg.textContent = data.message;
    }
});
</script>

</body>
</html>
