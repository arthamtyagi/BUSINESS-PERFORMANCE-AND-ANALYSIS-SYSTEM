<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Vynex</title>
    <link rel="stylesheet" href="logininfo.css">
</head>
<body class="auth-body">

<div class="auth-container">

    <img src="logo.png" class="auth-logo">
    <h2>Sign in to Vynex</h2>

    <form id="signinForm">
        <input type="email" id="email" placeholder="Email address" required>
        <input type="password" id="password" placeholder="Password" required>

        <button type="submit" class="cta">Sign In</button>
        <p id="msg" style="margin-top:10px; color:red;"></p>
    </form>

    <p>Don't have an account? <a href="signup.html">Create account</a></p>

</div>

<script>
document.getElementById("signinForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const email    = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const msg      = document.getElementById("msg");

    const res  = await fetch("/api/auth/signin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (res.ok) {
        // Store session token and user info
        localStorage.setItem("vynex_token",       data.token);
        localStorage.setItem("vynex_name",        data.name);
        localStorage.setItem("vynex_accountType", data.accountType);

        msg.style.color = "green";
        msg.textContent = "Welcome, " + data.name + "!";

        // Redirect based on account type
        setTimeout(() => {
            if (data.accountType === "business") {
                window.location.href = "mainfile.html";
            } else {
                window.location.href = "costumermainfile.html";
            }
        }, 800);
    } else {
        msg.style.color = "red";
        msg.textContent = data.message;
    }
});
</script>

</body>
</html>
